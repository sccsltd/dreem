# Dreem 2 / i.MX6ULL JTAG probe config for Tigard V1.1.
#
# Wiring must be target-powered with a shared GND and the Tigard voltage
# selector set to the measured target rail. Keep adapter speed low until the
# chain is known stable.

source [find interface/ftdi/tigard.cfg]

adapter speed 1000
transport select jtag

set CHIPNAME dreem_imx6ull
set SJC_TAPID 0x0891e01d
source [find target/imx6ul.cfg]
